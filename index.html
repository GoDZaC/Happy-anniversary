
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Anniversary ❤️</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #ffd6e7, #fff0f5);
      color: #9b2855;
    }

    .card {
      width: 100%;
      max-width: 500px;
      padding: 35px 24px;
      background: white;
      border-radius: 25px;
      box-shadow: 0 10px 35px #d86b8c40;
    }

    .heart {
      font-size: 75px;
      animation: beat 1s infinite;
    }

    h1 {
      color: #e84376;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 14px 22px;
      background: #e84376;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      color: #e84376;
      font-weight: bold;
    }

    @keyframes beat {
      50% { transform: scale(1.15); }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart">❤️</div>
    <h1>Happy Anniversary</h1>
    <p>
      สุขสันต์วันครบรอบนะคนพิเศษ 💕<br>
      ขอบคุณที่เข้ามาเป็นความสุขในทุก ๆ วัน
    </p>
    <p>ขอให้เรามีรอยยิ้มให้กันตลอดไป 🌷</p>

    <button onclick="showMessage()">
      กดอ่านข้อความพิเศษ 💌
    </button>

    <p id="message"></p>
  </main>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "รักเธอมากที่สุดเลย ❤️ ขอบคุณที่อยู่ด้วยกัน";
    }
  </script>
</body>
</html>
